%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov16a1q.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV16A1Q Image Sensor

maintainers:
  - Shubham Vishwakarma <shubhamvis98@fossfrog.in>

description:
  The OmniVision OV16A1Q is a 16 MP CMOS image sensor with an active array
  of 4608 x 3456 pixels. It is controlled through an I2C compatible interface
  and sends image data over a 4-lane MIPI CSI-2 D-PHY link.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov16a1q

  reg:
    maxItems: 1

  clocks:
    description: MCLK input clock (19.2 MHz).
    maxItems: 1

  power-domains:
    maxItems: 1

  reset-gpios:
    description: Active low reset GPIO.
    maxItems: 1

  vdig-supply:
    description: Digital core supply (1.2 V).

  vana-supply:
    description: Analog supply (2.8 V).

  vio-supply:
    description: I/O supply (1.8 V).

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vdig-supply
  - vana-supply
  - vio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "ovti,ov16a1q";
            reg = <0x10>;

            clocks = <&cam_mclk0>;
            assigned-clocks = <&cam_mclk0>;
            assigned-clock-rates = <19200000>;

            reset-gpios = <&tlmm 17 GPIO_ACTIVE_LOW>;

            vdig-supply = <&vreg_cam_dig>;
            vana-supply = <&vreg_cam_ana>;
            vio-supply = <&vreg_cam_io>;

            orientation = <0>;
            rotation = <90>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <384000000>;
                    remote-endpoint = <&csiphy3_ep>;
                };
            };
        };
    };
...
