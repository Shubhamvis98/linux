%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5khm2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5KHM2 Image Sensor

maintainers:
  - Shubham Vishwakarma <shubhamvis98@fossfrog.in>

description:
  The Samsung ISOCELL HM2 (S5KHM2) is a 108 MP CMOS image sensor with an
  active array of 12000 x 9000 pixels. It is controlled through an I2C
  compatible interface and sends image data over a 3-trio MIPI C-PHY link.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5khm2

  reg:
    maxItems: 1

  clocks:
    description: MCLK input clock (19.2 MHz).
    maxItems: 1

  power-domains:
    maxItems: 1

  reset-gpios:
    description: Active low reset GPIO.
    maxItems: 1

  vdig-supply:
    description: Digital core supply (1.05 V).

  vana-supply:
    description: Analog supply (2.8 V).

  vio-supply:
    description: I/O supply (1.8 V).

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 1 # MEDIA_BUS_TYPE_CSI2_CPHY

          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3

          link-frequencies: true

        required:
          - bus-type
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vdig-supply
  - vana-supply
  - vio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/media/video-interfaces.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "samsung,s5khm2";
            reg = <0x10>;

            clocks = <&cam_mclk1>;
            assigned-clocks = <&cam_mclk1>;
            assigned-clock-rates = <19200000>;

            reset-gpios = <&tlmm 16 GPIO_ACTIVE_LOW>;

            vdig-supply = <&vreg_cam_dig>;
            vana-supply = <&vreg_cam_ana>;
            vio-supply = <&vreg_cam_io>;

            orientation = <1>;
            rotation = <270>;
            lens-focus = <&vcm>;

            port {
                endpoint {
                    bus-type = <MEDIA_BUS_TYPE_CSI2_CPHY>;
                    data-lanes = <1 2 3>;
                    link-frequencies = /bits/ 64 <899200000>;
                    remote-endpoint = <&csiphy2_ep>;
                };
            };
        };
    };
...
