%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k5e9.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K5E9 Image Sensor

maintainers:
  - Shubham Vishwakarma <shubhamvis98@fossfrog.in>

description:
  The Samsung S5K5E9 is a 5 MP CMOS image sensor with an active array of
  2592 x 1944 pixels. It is controlled through an I2C compatible interface
  and sends image data over a 2-lane MIPI CSI-2 D-PHY link.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k5e9

  reg:
    maxItems: 1

  clocks:
    description: MCLK input clock (19.2 MHz).
    maxItems: 1

  power-domains:
    maxItems: 1

  reset-gpios:
    description: Active low reset GPIO.
    maxItems: 1

  vdig-supply:
    description: Digital core supply (1.2 V).

  vana-supply:
    description: Analog supply (2.8 V).

  vio-supply:
    description: I/O supply (1.8 V).

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vdig-supply
  - vana-supply
  - vio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@2d {
            compatible = "samsung,s5k5e9";
            reg = <0x2d>;

            clocks = <&cam_mclk2>;
            assigned-clocks = <&cam_mclk2>;
            assigned-clock-rates = <19200000>;

            reset-gpios = <&tlmm 106 GPIO_ACTIVE_LOW>;

            vdig-supply = <&vreg_cam_dig>;
            vana-supply = <&vreg_cam_ana>;
            vio-supply = <&vreg_cam_io>;

            orientation = <1>;
            rotation = <270>;
            lens-focus = <&vcm>;

            port {
                endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <438400000>;
                    remote-endpoint = <&csiphy0_ep>;
                };
            };
        };
    };
...
